# Configuración de gitleaks (base común de dev-plantillas: no editar acá, se
# actualiza con `copier update`). Usa las reglas por defecto de gitleaks.
#
# Falsos positivos puntuales: agregar el fingerprint del hallazgo a
# .gitleaksignore (un archivo propio del repo), explicando por qué en el MR/PR.
# Un secreto real no se ignora: se rota (SECURITY.md).
title = "gitleaks (base común)"

[extend]
useDefault = true

[[allowlists]]
description = "Archivos de lock y sumas de dependencias (hashes, no secretos)"
paths = [
  '''(^|/)go\.sum$''',
  '''(^|/)package-lock\.json$''',
  '''(^|/)gradle/verification-metadata\.xml$''',
]

# El atributo aria-keyshortcuts (atajos de teclado como «Shift+ArrowLeft»)
# no es una clave: generic-api-key lo toma por el «key» del nombre. Se mira
# sólo el match del hallazgo, no la línea: una clave real en la misma línea se
# sigue detectando.
[[allowlists]]
description = "Atributo aria-keyshortcuts (atajos de teclado, no una clave)"
regexTarget = "match"
regexes = [
  '''^aria-keyshortcuts="[A-Za-z+ ]*"?$''',
]

# La config web de Firebase (apiKey «AIza…») no es secreta: termina en el
# bundle y la protegen las reglas de Firebase y las restricciones de la clave.
# Sólo las reglas de claves de API y sólo en src/environments (config pública del
# front): una clave en cualquier otro archivo se sigue detectando.
[[allowlists]]
description = "Config web de Firebase en src/environments (pública por diseño)"
targetRules = ["gcp-api-key", "generic-api-key"]
paths = [
  '''(^|/)src/environments/environment(\.[\w-]+)?\.ts$''',
]
